<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="¿Tu empresa quiere ser piloto? Escríbenos."><title>¿Tu empresa quiere ser piloto? Escríbenos.</title><style>@font-face{font-family:HBB;src:url(data:font/woff;base64,) format('woff')}.b{font-family:HBB,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:HBM;src:url(data:font/woff;base64,) format('woff')}.m{font-family:HBM,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:HBR;src:url(data:font/woff;base64,) format('woff')}.s{font-family:HBR,'Segoe UI',Helvetica,Arial,sans-serif}text{font-kerning:normal}</style><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
