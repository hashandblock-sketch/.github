</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.1" fill="#D4AF37" fill-opacity=".10"/>
</pattern>
<linearGradient id="goldbtn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D98B"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B08A2A"/></linearGradient><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs><rect width="1000" height="320" rx="22" fill="#0B0B0C"/><rect width="1000" height="320" rx="22" fill="url(#dots)"/><rect x=".75" y=".75" width="998.5" height="318.5" rx="21.5" fill="none" stroke="url(#gold)" stroke-width="1.5"/><ellipse cx="500" cy="250" rx="360" ry="130" fill="url(#glow)"><animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/></ellipse><text class="m" x="500" y="66" text-anchor="middle" font-size="14" fill="#D4AF37" letter-spacing="5">PROGRAMA PILOTO</text><text class="m" x="500" y="116" text-anchor="middle" font-size="36" fill="#F2EEE4">¿Tu empresa quiere ser piloto?</text><text class="s" x="500" y="156" text-anchor="middle" font-size="17" fill="#9A9284">Buscamos empresas en Ecuador que necesiten demostrar</text><text class="s" x="500" y="181" text-anchor="middle" font-size="17" fill="#9A9284">la integridad de sus contratos, informes o entregables.</text><rect x="284" y="210" width="432" height="72" rx="36.0" fill="none" stroke="#D4AF37" stroke-width="1.5"><animate attributeName="opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/></rect><clipPath id="pill"><rect x="290" y="216" width="420" height="60" rx="30.0"/></clipPath><g clip-path="url(#pill)"><rect x="290" y="216" width="420" height="60" fill="url(#goldbtn)"/><rect x="170" y="216" width="90" height="60" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="130;870" dur="3s" repeatCount="indefinite"/></rect></g><text class="b" x="486.0" y="253" text-anchor="middle" font-size="16" fill="#0B0B0C" letter-spacing="2">QUIERO SER EMPRESA PILOTO</text><path d="M666 246 H684 M677 239 L684 246 L677 253" stroke="#0B0B0C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.2s" repeatCount="indefinite"/></path></svg>