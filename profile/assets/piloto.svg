  <stop offset=".7" stop-color="#D4AF37"/><stop offset="1" stop-color="#8E6B1E"/>
</linearGradient>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
  <stop offset="0" stop-color="#F3D98B" stop-opacity="0"/>
  <stop offset=".5" stop-color="#F3D98B" stop-opacity=".95"/>
  <stop offset="1" stop-color="#F3D98B" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1300 0" dur="4.5s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#D4AF37" stop-opacity=".32"/>
  <stop offset=".55" stop-color="#D4AF37" stop-opacity=".07"/>
